  <rect x="10" y="20" width="12" height="30" fill="#4285F4"/>
  <rect x="26" y="12" width="12" height="38" rx="4" fill="#EA4335"/>
  <rect x="42" y="27" width="12" height="23" rx="6" fill="#FBBC05"/>
  <rect x="7" y="50" width="50" height="6" rx="3" fill="#34A853"/>
</svg>
